name: iOS Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      build_name:
        description: "Version name (ej. 0.2.0). Si se deja vacío se usa el tag o 0.1.0."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.4"

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolver versión
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.build_name }}" ]; then
            BUILD_NAME="${{ inputs.build_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            BUILD_NAME="${GITHUB_REF_NAME#v}"
          else
            BUILD_NAME="$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          fi
          echo "build_name=${BUILD_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Versión: ${BUILD_NAME}+${GITHUB_RUN_NUMBER}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (lib)
        run: flutter analyze lib

      - name: Pod install
        run: |
          cd ios
          pod install --repo-update

      # Valida que el target de dispositivo compila en release sin firma.
      # El .app resultante sin firmar no es instalable; el artefacto
      # descargable de simulador se genera en el paso siguiente.
      - name: Build iOS device (release, no-codesign)
        run: >
          flutter build ios --release --no-codesign
          --build-name="${{ steps.version.outputs.build_name }}"
          --build-number="${{ steps.version.outputs.build_number }}"

      # Build de simulador (solo debug, Apple no soporta release en
      # simulador). El .app se empaqueta para probar en Simulator.
      - name: Build iOS simulador (debug, no-codesign)
        run: >
          flutter build ios --simulator --no-codesign
          --build-name="${{ steps.version.outputs.build_name }}"
          --build-number="${{ steps.version.outputs.build_number }}"

      - name: Empaquetar .app de simulador
        run: |
          VERSION="${{ steps.version.outputs.build_name }}+${{ steps.version.outputs.build_number }}"
          mkdir -p dist
          APP_PATH="$(find build/ios/iphonesimulator -maxdepth 2 -name '*.app' | head -1)"
          echo "App encontrada: $APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "dist/MySchoolMyParents-${VERSION}-ios-simulator.zip"
          ls -lh dist/

      # IPA firmada opcional. Requiere en secrets:
      # IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64,
      # IOS_CERT_IDENTITY, IOS_EXPORT_PLIST_BASE64, APPLE_TEAM_ID
      # Si no existen, se omite sin fallar (ver step siguiente).
      - name: Importar firma Apple (si hay secrets)
        id: signing
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.IOS_P12_BASE64 }}" ]; then
            echo "Sin secrets iOS: se omite IPA firmada."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${{ secrets.IOS_P12_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          echo "${{ secrets.IOS_EXPORT_PLIST_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/ExportOptions.plist"
          security create-keychain -p actions actions.keychain
          security default-keychain -s actions.keychain
          security unlock-keychain -p actions actions.keychain
          security import "$RUNNER_TEMP/cert.p12" -k actions.keychain -P "${{ secrets.IOS_P12_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions actions.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build IPA (solo con firma)
        if: steps.signing.outputs.available == 'true'
        run: >
          flutter build ipa --release
          --build-name="${{ steps.version.outputs.build_name }}"
          --build-number="${{ steps.version.outputs.build_number }}"
          --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Copiar IPA a dist (si existe)
        if: steps.signing.outputs.available == 'true'
        run: |
          VERSION="${{ steps.version.outputs.build_name }}+${{ steps.version.outputs.build_number }}"
          find build/ios/ipa -name '*.ipa' -exec cp {} "dist/MySchoolMyParents-${VERSION}-ios.ipa" \;
          ls -lh dist/

      - name: Publicar en GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-ios-{0}', steps.version.outputs.build_name) }}
          name: "MySchoolMyParents iOS ${{ steps.version.outputs.build_name }}+${{ steps.version.outputs.build_number }}"
          body: |
            ## iOS ${{ steps.version.outputs.build_name }}+${{ steps.version.outputs.build_number }}

            - `*-ios-simulator.zip`: build de simulador (sin firma, solo para pruebas en Simulator).
            - `*-ios.ipa`: solo aparece si se configuraron los secrets de firma Apple
              (IOS_P12_*, IOS_PROVISIONING_PROFILE_*, IOS_EXPORT_PLIST_*, APPLE_TEAM_ID).

            Para instalar en iPhone físico / TestFlight hay que configurar la firma.
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            dist/*.zip
            dist/*.ipa
